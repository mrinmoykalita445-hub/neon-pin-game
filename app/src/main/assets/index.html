<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEON PIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0f12; color: #f2f6ff; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: #171b24; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 254, 0.2); max-width: 95vw; max-height: 80vh; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #00f2fe; text-shadow: 0 0 10px #00f2fe; }
    </style>
</head>
<body>
    <h1>NEON PIN</h1>
    <canvas id="gameCanvas" width="360" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let angle = 0;
        let pins = [];
        let score = 0;
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw center rotating orb
            ctx.save();
            ctx.translate(canvas.width / 2, 200);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.fillStyle = '#00f2fe';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';
            ctx.fill();
            
            // Draw stuck pins
            pins.forEach(p => {
                ctx.save();
                ctx.rotate(p.angle - angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, 100);
                ctx.strokeStyle = '#9b64ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 100, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                ctx.restore();
            });
            
            ctx.restore();
            
            // Draw launcher pin at bottom
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 420, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            
            angle += 0.02;
            requestAnimationFrame(draw);
        }
        
        canvas.addEventListener('click', () => {
            pins.push({ angle: angle });
            score++;
        });
        
        draw();
    </script>
</body>
</html>
